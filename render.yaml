services:
  # 1. FastAPI Backend API
  - type: web
    name: sara-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sara-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production

  # 2. Celery Background Worker
  - type: worker
    name: sara-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerCommand: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sara-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sara-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: sara-backend
          envVarKey: JWT_SECRET

  # 3. Frontend Static Site
  - type: web
    name: sara-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sara-backend
          property: url

databases:
  # 4. Managed PostgreSQL Database
  - name: sara-postgres
    databaseName: sara_db
    user: sara_user
    plan: free
    region: oregon
    postgresMajorVersion: "15"

  # 5. Managed Redis
  - name: sara-redis
    plan: free
    region: oregon
